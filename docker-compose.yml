services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recados
      MYSQL_USER: recados_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ProjetoRecados
      APP_ENV: local
      APP_KEY: ${APP_KEY:?Defina APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: recados
      DB_USERNAME: recados_user
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: file
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax

      SANCTUM_STATEFUL_DOMAINS: "localhost:5173,${CODESPACE_NAME:-local}-5173.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}"

    volumes:
      - anexos_data:/app/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  mysql_data:
  anexos_data: